spring:
  application:
    name: foms
  datasource:
    url: ${FOMS_DB_URL:jdbc:postgresql://localhost:5432/foms}
    username: ${FOMS_DB_USERNAME:foms}
    password: ${FOMS_DB_PASSWORD:foms}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
server:
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
